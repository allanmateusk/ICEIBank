name: iceibank-sprint2
services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "127.0.0.1:5678:5672"
      - "127.0.0.1:15678:15672"
    environment:
      RABBITMQ_DEFAULT_USER: iceibank
      RABBITMQ_DEFAULT_PASS: iceibank-dev
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  rabbitmq-data:
